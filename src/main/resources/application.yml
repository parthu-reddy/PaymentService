spring:
  application:
    name: payment-service
  main:
    allow-bean-definition-overriding: true
  config:
    import: optional:classpath:config/platform-defaults.yml,optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
resilience4j:
  circuitbreaker:
    instances:
      gatewayCB:
        baseConfig: default
      vyaparRefund:
        baseConfig: default
      razorpayGateway:
        baseConfig: default
      razorpayRefund:
        baseConfig: default
      cashfreeGateway:
        baseConfig: default
      cashfreeRefund:
        baseConfig: default

payments:
  routing:
    CARD: RAZORPAY
    UPI: CASHFREE
    WALLET: VYAPAR
idempotency:
  sweep:
    retention-days: 400
