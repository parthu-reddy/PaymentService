spring:
  task:
    execution:
      pool:
        core-size: 10
        max-size: 100
        queue-capacity: 500
        thread-name-prefix: "webhook-worker-"
  application:
    name: payment-service
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.add.type.headers: false

resilience4j.circuitbreaker:
  instances:
    gatewayCB:
      registerHealthIndicator: true
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 5s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10

# Gateway Configs (Must be provided via ENV variables in production)
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:test_rzp_key_id}
    secret: ${RAZORPAY_KEY_SECRET:test_rzp_key_secret}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:test_rzp_webhook_secret}

cashfree:
  client:
    id: ${CASHFREE_CLIENT_ID:test_cf_client_id}
    secret: ${CASHFREE_CLIENT_SECRET:test_cf_client_secret}

vyapargateway:
  api:
    key: ${VYAPAR_API_KEY_SECRET:test_vyapar_api_key}
  base:
    url: ${VYAPAR_BASE_URL:https://api.vyapargateway.com/v1}
  webhook:
    secret: ${VYAPAR_WEBHOOK_SIGNING_SECRET:test_vyapar_webhook_secret}

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}


