# Stub resolution. LOCAL by default so a developer's `mvn test` behaves exactly as before and needs
# no credentials; CI overrides STUBRUNNER_MODE=REMOTE to resolve from the shared contracts registry
# instead of requiring every producer to be built into ~/.m2 first.
#
# Stub Runner does NOT read settings.xml credentials -- its own documentation says authentication
# details for repositories and profiles are not taken into account -- so it carries its own
# username/password rather than reusing .github/maven-settings.xml.
stubrunner:
  stubs-mode: ${STUBRUNNER_MODE:LOCAL}
  repository-root: ${STUBRUNNER_ROOT:}
  username: ${STUBRUNNER_USERNAME:}
  password: ${STUBRUNNER_PASSWORD:}

spring:
  config:
    import: ""
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: contract-test-verifier
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
eureka:
  client:
    enabled: false
payments:
  routing:
    CARD: RAZORPAY
    UPI: CASHFREE
    WALLET: VYAPAR

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
# Mock gateways are the point of a test run, so say so explicitly -- PaymentStartupInvariants
# refuses to start otherwise, which is what stops a deployment shipping them by accident.
app:
  payments:
    allow-mock-gateways: true
