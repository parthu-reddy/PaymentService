version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: payment_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: payment_redis
    ports:
      - "16379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
